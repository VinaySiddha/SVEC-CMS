name: Build, Scan, and Deploy Docker Image

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vinaysiddha/svec-cms

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NODE_ENV=production
          provenance: false
          sbom: false

      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: echo "${{ steps.build-and-push.outputs.digest }}"

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scan (SARIF output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0
          trivyignores: .trivyignore

      - name: Sanitize SARIF file paths
        run: |
          if [ -f trivy-results.sarif ]; then
            cp trivy-results.sarif trivy-results.sarif.backup
            sed -i 's|/app/.next/server/app/api/\[.*\]/|\[FILTERED_PATH\]/|g' trivy-results.sarif
          fi

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Upload SARIF file as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: trivy-results.sarif

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/Final_Blast' ||
      github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e

            echo "Starting deployment"
            echo "Branch: ${{ github.ref_name }}"
            echo "Image: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"

            cd /var/www/srivasaviengg.ac.in

            # Create uploads directory and set permissions
            echo "Setting up uploads directory..."
            mkdir -p /var/www/srivasaviengg.ac.in/uploads
            # Set ownership: www-data for both Nginx and Docker to access
            chown -R www-data:www-data /var/www/srivasaviengg.ac.in/uploads
            # Set permissions: directories 755, files will be 644 when created
            chmod -R 755 /var/www/srivasaviengg.ac.in/uploads
            echo "Uploads directory ready"

            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            CONTAINERS_ON_PORT=$(docker ps --filter "publish=4000" --format "{{.Names}}" || true)
            for container in $CONTAINERS_ON_PORT; do
              docker stop "$container" || true
              docker rm "$container" || true
            done

            if docker ps -a --format '{{.Names}}' | grep -q '^svec-cms$'; then
              docker stop svec-cms || true
              docker rm svec-cms || true
            fi

            if lsof -ti:4000 >/dev/null 2>&1; then
              kill -9 $(lsof -ti:4000) || true
              sleep 2
            fi

            docker network prune -f || true
            (systemctl restart docker || true) &
            sleep 8

            docker run -d \
              --name svec-cms \
              --restart unless-stopped \
              --user www-data:www-data \
              -p 4000:3000 \
              -v /var/www/srivasaviengg.ac.in/uploads:/app/public/uploads \
              -e UPLOAD_DIR=/app/public/uploads \
              --env-file .env.production \
              ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            sleep 3

            docker image prune -f

            docker ps --filter "name=svec-cms" \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          script: |
            sleep 10

            if ! docker ps --format '{{.Names}}' | grep -q '^svec-cms$'; then
              docker logs svec-cms --tail 50 || true
              exit 1
            fi

            curl -s http://localhost:4000 >/dev/null || true
            docker logs svec-cms --tail 20 || true

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deployment completed successfully"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
          else
            echo "Deployment failed"
          fi
