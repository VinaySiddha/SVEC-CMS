name: Build and Push Docker Image

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, master ]

  # Allow manual triggering
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vinaysiddha/svec-cms

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Currently building AMD64 only due to ARM64 network timeout issues
          # To re-enable ARM64: change to "linux/amd64,linux/arm64"
          # ARM64 builds may timeout during npm install due to emulation overhead
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NODE_ENV=production
          provenance: false
          sbom: false

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo ${{ steps.build-and-push.outputs.digest }}

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build-and-push
    
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner (SARIF format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Filter SARIF for valid URIs
        run: |
          # Create a simple filter to remove problematic URIs with brackets
          if [ -f trivy-results.sarif ]; then
            # Make a backup
            cp trivy-results.sarif trivy-results.sarif.backup
            # Filter out entries with brackets in URIs that cause validation issues
            sed -i 's|/app/.next/server/app/api/\[.*\]/|\[FILTERED_PATH\]/|g' trivy-results.sarif
          fi

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload SARIF file as artifact (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: trivy-results.sarif

  # Deploy to VPS
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Final_Blast' || github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          debug: false
          script: |
            set -e  # Exit on error

            echo "🚀 Starting deployment..."
            echo "📦 Branch: ${{ github.ref_name }}"
            echo "🏷️  Image: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}"

            # Navigate to project directory
            cd /var/www/srivasaviengg.ac.in

            # Pull latest Docker image
            echo "📥 Pulling latest Docker image..."
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            # Stop all containers using port 4000
            echo "🛑 Checking for containers using port 4000..."
            CONTAINERS_ON_PORT=$(docker ps --filter "publish=4000" --format "{{.Names}}" || true)
            if [ ! -z "$CONTAINERS_ON_PORT" ]; then
              echo "   Found containers on port 4000: $CONTAINERS_ON_PORT"
              for container in $CONTAINERS_ON_PORT; do
                echo "   Stopping container: $container"
                docker stop $container || true
                docker rm $container || true
              done
            fi

            # Check if svec-cms container exists (in case it's using a different port)
            echo "🛑 Checking for svec-cms container..."
            if docker ps -a --format '{{.Names}}' | grep -q '^svec-cms$'; then
              echo "   Found svec-cms container, removing..."
              docker stop svec-cms || true
              docker rm svec-cms || true
            fi

            # Verify container is gone
            if docker ps -a --format '{{.Names}}' | grep -q '^svec-cms$'; then
              echo "❌ Failed to remove old container"
              exit 1
            fi

            # Kill any process still using port 4000 (fallback)
            echo "🔍 Checking if port 4000 is free..."
            if lsof -ti:4000 >/dev/null 2>&1; then
              echo "⚠️  Port 4000 still in use, killing process..."
              kill -9 $(lsof -ti:4000) || true
              sleep 2
            fi

            # Clean up Docker networks to fix iptables issues
            echo "🧹 Cleaning up Docker networks..."
            docker network prune -f || true
            sleep 2

            # If iptables issue persists, restart Docker daemon in background
            echo "🔄 Refreshing Docker networking if needed..."
            (systemctl restart docker && echo "Docker restarted" || true) &
            sleep 8
            echo "✅ Docker networking refreshed"

            # Run new container
            echo "🚀 Starting new container..."
            docker run -d \
              --name svec-cms \
              --restart unless-stopped \
              -p 4000:3000 \
              -v /var/www/srivasaviengg.ac.in/uploads:/var/www/uploads \
              --env-file .env.production \
              ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            # Verify container started
            echo "⏳ Waiting for container to start..."
            sleep 3

            if docker ps --format '{{.Names}}' | grep -q '^svec-cms$'; then
              echo "✅ Container started successfully"
            else
              echo "❌ Container failed to start"
              docker logs svec-cms --tail 50 || true
              exit 1
            fi

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            # Show container status
            echo "📊 Container status:"
            docker ps --filter "name=svec-cms" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "✅ Deployment completed successfully!"
            echo "🌐 Application is running on port 4000"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          script: |
            echo "🔍 Verifying deployment..."

            # Wait for application to be ready
            echo "⏳ Waiting 10 seconds for application to start..."
            sleep 10

            # Check if container is running
            if docker ps --format '{{.Names}}' | grep -q '^svec-cms$'; then
              echo "✅ Container is running"

              # Show container details
              echo "📊 Container details:"
              docker ps --filter "name=svec-cms" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            else
              echo "❌ Container is not running"

              # Check if container exists but is stopped
              if docker ps -a --format '{{.Names}}' | grep -q '^svec-cms$'; then
                echo "⚠️  Container exists but is stopped"
                echo "📋 Last 50 lines of logs:"
                docker logs svec-cms --tail 50 || true
              else
                echo "❌ Container does not exist"
              fi

              exit 1
            fi

            # Check if app is responding
            echo "🔍 Testing application health..."
            if curl -s -f http://localhost:4000 > /dev/null 2>&1; then
              echo "✅ Application is responding on port 4000"
            else
              echo "⚠️  Application is not responding yet (may need more time)"
              echo "📋 Recent container logs:"
              docker logs svec-cms --tail 30 || true
            fi

            # Show recent logs
            echo ""
            echo "📋 Last 20 lines of application logs:"
            docker logs svec-cms --tail 20 2>&1 || echo "Could not fetch logs"

            echo ""
            echo "✅ Verification completed"

      - name: Deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to VPS completed successfully!"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
          else
            echo "❌ Deployment to VPS failed!"
          fi
